apiVersion: agents.hermeum.app/v1alpha1
kind: HermesAgent
metadata:
  name: hermes
spec:
  runtimeClassName: kata
  hermes:
    image: docker.io/nahsilabs/hermes-agent:latest@sha256:f7db7777e8207edb3bde432fa80d443ad45fd845d3a67167fd3274f6d0d5aeb2
    workspace:
      files:
        plugin-data/hermes-snapcompact/mode.yaml: |
          mode: snapcompact
    config:
      raw:
        model:
          provider: custom
          default: Qwen/Qwen3.8-Flash-Next
          base_url: https://ai.nahsi.dev/v1
          key_env: AI_GATEWAY_API_KEY
          context_length: 262144
          streaming: true
          supports_vision: true
        fallback_providers: []
        timezone: Europe/Athens
        sessions:
          auto_archive: true
          auto_archive_days: 5
        agent:
          max_turns: null
          image_input_mode: native
          environment_hint: >-
            You run in a Kubernetes container, not on the user's personal computer.
            /opt/data is your persistent home; changes elsewhere in the container
            may be lost when it is replaced. Your deployment and managed
            configuration are maintained through GitOps, so local edits alone
            do not update the deployment source.
        terminal:
          backend: local
          shell_init_files:
            - ~/.profile
            - ~/.bash_profile
            - ~/.bashrc
            - /opt/hermes/.venv/bin/activate
        browser:
          cloud_provider: local
          headed: false
          use_real_profile: false
        approvals:
          mode: smart
        security:
          redact_secrets: true
        telemetry:
          shared_metrics:
            enabled: true
            send: false
        nous:
          guest: false
        tools:
          connectors:
            enabled: false
        memory:
          memory_enabled: false
          user_profile_enabled: false
        context:
          engine: hermes-snapcompact
        plugins:
          enabled:
            - langfuse
          disabled:
            - web-openai-native
        skills:
          write_approval: true
          external_dirs:
            - /opt/managed-skills
            - /opt/hermes/skills
          creation_nudge_interval: 0
          disabled:
            - airtable
            - apple-notes
            - apple-reminders
            - architecture-diagram
            - baoyu-infographic
            - box
            - claude-code
            - claude-design
            - codebase-inspection
            - codex
            - competitor-news-monitor
            - computer-use
            - design-md
            - dogfood
            - findmy
            - github
            - hermes-agent-skill-authoring
            - himalaya
            - imessage
            - inspecting-hermes-desktop-dom
            - llm-wiki
            - manim-video
            - node-inspect-debugger
            - notion
            - obsidian
            - opencode
            - p5js
            - popular-web-designs
            - python-debugpy
            - requesting-code-review
            - sdlc-review
            - simplify-code
            - songwriting-and-ai-music
            - teams-meeting-pipeline
            - test-driven-development
            - xurl
        curator:
          enabled: false
        delegation:
          max_concurrent_children: 2
          provider: openai-codex
          model: gpt-6.1-sol
          reasoning_effort: low
          fallback_providers: []
        kanban:
          dispatch_in_gateway: false
          auto_decompose: false
          auto_subscribe_on_create: false
          review_dispatch: false
        moa:
          presets:
            default:
              enabled: false
        auxiliary:
          background_review:
            enabled: false
          approval:
            provider: custom
            model: Qwen/Qwen3.8-Flash-Next
            base_url: https://ai.nahsi.dev/v1
            api_key: ${AI_GATEWAY_API_KEY}
            reasoning_effort: none
            extra_body:
              temperature: 0
              prompt_cache_policy: no_store
          title_generation:
            provider: custom
            model: Qwen/Qwen3.8-Flash-Next
            base_url: https://ai.nahsi.dev/v1
            api_key: ${AI_GATEWAY_API_KEY}
            reasoning_effort: none
            extra_body:
              temperature: 0
              prompt_cache_policy: no_store
        stt:
          enabled: true
          echo_transcripts: false
          streaming: true
          provider: openai
          language: auto
          openai:
            base_url: https://ai.nahsi.dev/v1
            api_key: ${AI_GATEWAY_API_KEY}
            model: nvidia/nemotron-3.5-asr-streaming-0.6b
            streaming_model: nvidia/nemotron-3.5-asr-streaming-0.6b
        tts:
          provider: openai
          openai:
            base_url: https://ai.nahsi.dev/v1
            api_key: ${AI_GATEWAY_API_KEY}
            model: Qwen/Qwen3-TTS
            language: auto
        voice:
          auto_tts: false
          client_direct: false
        display:
          message_reactions: true
          show_reasoning: true
        updates:
          check: false
        dashboard:
          trusted_proxies:
            - 10.244.0.0/16
      apiServer:
        enabled: false
      webhook:
        enabled: false
    ports:
      - name: dashboard
        containerPort: 9119
        protocol: TCP
    probes:
      liveness: &probe
        enabled: true
        periodSeconds: 60
        timeoutSeconds: 45
      readiness: *probe
      startup: *probe
    resources:
      requests:
        cpu: "2"
        memory: 2Gi
      limits:
        cpu: "4"
        memory: 4Gi
    storage:
      snapshot:
        enabled: false
    initChownData: true
  security:
    rbac:
      createServiceAccount: true
  networking:
    service:
      type: ClusterIP
      ports:
        - name: dashboard
          port: 9119
          targetPort: 9119
          protocol: TCP
