apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayModel
metadata:
  name: lfm3-omni-2b
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: ai-llm
  match:
    model: LiquidAI/LFM3-Omni-2B
  provider: Custom
  custom:
    backendRef:
      kind: Service
      name: qwen3-8-flash-next
      port: 8080
    formats:
      - type: Completions
        path: /v1/chat/completions
  policies:
    transformations:
      - field: model
        expression: '"LFM3-Omni-2B"'
