apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayModel
metadata:
  name: sharetab-qwen3-8-flash-next
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: ai-llm
  match:
    model: sharetab/qwen3.8-flash-next
  provider: Custom
  custom:
    backendRef:
      kind: Service
      name: qwen3-8-flash-next
      port: 8080
    formats:
      - type: Completions
        path: /v1/chat/completions
  # ShareTab can't set thinking or sampling; greedy keeps receipt amounts stable.
  policies:
    transformations:
      - field: model
        expression: '"Qwen/Qwen3.8-Flash-Next"'
      - field: reasoning_effort
        expression: '"none"'
      - field: temperature
        expression: "0"
      - field: presence_penalty
        expression: "0"
