apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bge-m3
spec:
  interval: 1h
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    controllers:
      main:
        replicas: 0
        strategy: Recreate
        containers:
          main:
            image:
              repository: ghcr.io/huggingface/text-embeddings-inference
              tag: cpu-1.9.3@sha256:ad950d30878eceb72aaf32024d26fa2b1d04a75304fa0b4776b49aa1941fea07
            args:
              - --model-id
              - BAAI/bge-m3
              - --hostname
              - 0.0.0.0
              - --port
              - "8080"
              - --auto-truncate
              - --max-batch-tokens
              - "4096"
              - --max-client-batch-size
              - "64"
            probes:
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8080
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8080
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8080
                  periodSeconds: 10
                  failureThreshold: 120
            resources:
              requests:
                cpu: "1"
                memory: 8Gi
              limits:
                cpu: "4"
                memory: 16Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL

    defaultPodOptions:
      nodeSelector:
        kubernetes.io/hostname: heliopolis
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

    service:
      main:
        controller: main
        labels:
          app.kubernetes.io/part-of: tei
        ports:
          http:
            port: 8080

    persistence:
      data:
        existingClaim: bge-m3-cache
        globalMounts:
          - path: /data
