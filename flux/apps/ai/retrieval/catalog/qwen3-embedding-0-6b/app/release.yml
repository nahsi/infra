apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: qwen3-embedding-0-6b
spec:
  interval: 1h
  timeout: 20m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    controllers:
      main:
        replicas: null
        strategy: RollingUpdate
        rollingUpdate:
          maxUnavailable: 0
          maxSurge: 1
        containers:
          main:
            image:
              repository: docker.io/nahsilabs/qwen3-embedding-tei
              tag: cpu-1.9.3-97b0c614@sha256:5ea74e292361bc006d767cb6b3bdebac60851284271b5e33b6a4acd6dffff3b2
            args:
              - --hostname
              - 0.0.0.0
              - --json-output
            env:
              MKL_NUM_THREADS: "2"
              OMP_NUM_THREADS: "2"
              RAYON_NUM_THREADS: "2"
              TOKIO_WORKER_THREADS: "1"
              TOKENIZATION_WORKERS: "1"
            probes:
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /info
                    port: 8080
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /info
                    port: 8080
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8080
                  periodSeconds: 10
                  failureThreshold: 120
            resources:
              requests:
                cpu: "2"
                memory: 6Gi
              limits:
                cpu: "2"
                memory: 8Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL

    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault

    service:
      main:
        controller: main
        labels:
          app.kubernetes.io/part-of: tei
        ports:
          http:
            port: 8080

    persistence:
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
