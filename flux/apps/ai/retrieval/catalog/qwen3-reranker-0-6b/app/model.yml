apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayModel
metadata:
  name: qwen3-reranker-0-6b
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: ai-llm
  match:
    model: Qwen/Qwen3-Reranker-0.6B
  provider: Custom
  custom:
    # Halogen NPU name set in qwen3-8-flash-next/app/npu-model-names.yml.
    backendRef:
      kind: Service
      name: qwen3-8-flash-next
      port: 8080
    formats:
      - type: Rerank
        path: /v1/rerank
