apiVersion: apps/v1
kind: Deployment
metadata:
  name: zerank-2
  labels:
    app.kubernetes.io/name: zerank-2
    app.kubernetes.io/part-of: llama-cpp
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: zerank-2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zerank-2
        app.kubernetes.io/part-of: llama-cpp
    spec:
      priorityClassName: high-priority
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: llama-server
          image: ghcr.io/ggml-org/llama.cpp:server-intel-b10820@sha256:35037559d99a90963d479b6e6e79764b138c76dc657341292aac6ad41d627c9f
          args:
            - --model-url
            - https://huggingface.co/seamon67/Zerank-2-GGUF/resolve/bc7449f38bc0ea3ecc36ef75bdedd1575927607f/Zerank-2-4B-Q8_0.gguf
            - --model
            - /models/Zerank-2-4B-Q8_0.gguf
            - --alias
            - zeroentropy/zerank-2
            - --reranking
            - --pooling
            - rank
            - --ctx-size
            - "9216"
            - --parallel
            - "3"
            - --kv-unified
            - --kv-unified-per-slot
            - "3072"
            - --cache-ram
            - "0"
            - --batch-size
            - "3072"
            - --ubatch-size
            - "3072"
            - --gpu-layers
            - all
            - --fit
            - "off"
            - --flash-attn
            - "on"
            - --threads
            - "4"
            - --host
            - 0.0.0.0
            - --port
            - "8080"
            - --metrics
          env:
            - name: HOME
              value: /models
            - name: LLAMA_CACHE
              value: /models
            - name: ONEAPI_DEVICE_SELECTOR
              value: level_zero:0
            - name: UR_L0_ENABLE_RELAXED_ALLOCATION_LIMITS
              value: "1"
            - name: ZES_ENABLE_SYSMAN
              value: "1"
            - name: GGML_SYCL_ENABLE_FLASH_ATTN
              value: "1"
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: "1"
              memory: 4Gi
              ephemeral-storage: 512Mi
              gpu.intel.com/xe: "1"
            limits:
              cpu: "2"
              memory: 6Gi
              ephemeral-storage: 2Gi
              gpu.intel.com/xe: "1"
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 180
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: models
              mountPath: /models
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: zerank-2-cache
---
apiVersion: v1
kind: Service
metadata:
  name: zerank-2
  labels:
    app.kubernetes.io/name: zerank-2
    app.kubernetes.io/part-of: llama-cpp
spec:
  selector:
    app.kubernetes.io/name: zerank-2
  ports:
    - name: http
      port: 8080
      targetPort: http
