apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: realtimestt-multilingual-ai
spec:
  parentRefs:
    - name: agenticgateway-internal
      namespace: agenticgateway
      sectionName: https
  hostnames:
    - ai.nahsi.dev
  rules:
    - name: transcription
      matches:
        - path:
            type: Exact
            value: /v1/audio/transcriptions
      backendRefs:
        - kind: Service
          name: realtimestt-multilingual
          port: 8000
    - matches:
        - path:
            type: Exact
            value: /v1/realtime
      timeouts:
        request: 0s
        backendRequest: 0s
      backendRefs:
        - kind: Service
          name: realtimestt-multilingual
          port: 8000
