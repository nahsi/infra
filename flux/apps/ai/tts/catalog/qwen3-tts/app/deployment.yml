apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen3-tts
  labels:
    app.kubernetes.io/name: qwen3-tts
    app.kubernetes.io/part-of: qwentts
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: qwen3-tts
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qwen3-tts
        app.kubernetes.io/part-of: qwentts
    spec:
      priorityClassName: high-priority
      terminationGracePeriodSeconds: 120
      securityContext:
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: qwen3-tts
          image: docker.io/nahsilabs/qwentts-sycl:latest@sha256:66cdbfc7709a5a703fc2ded354f76d155fef1fea98b91ccfaecd975c991dcbfa
          env:
            - name: MODEL_PATH
              value: /models/qwen-talker-1.7b-base-Q8_0.gguf
            - name: CODEC_PATH
              value: /models/qwen-tokenizer-12hz-Q8_0.gguf
            - name: MODEL_ALIAS
              value: Qwen/Qwen3-TTS
            - name: DEFAULT_VOICE
              value: kai
            - name: MAX_BATCH
              value: "2"
            - name: ONEAPI_DEVICE_SELECTOR
              value: level_zero:0
            - name: HOME
              value: /tmp
            - name: XDG_CACHE_HOME
              value: /tmp/.cache
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 250m
              memory: 4Gi
              ephemeral-storage: 512Mi
              gpu.intel.com/xe: "1"
            limits:
              cpu: "2"
              memory: 4Gi
              ephemeral-storage: 2Gi
              gpu.intel.com/xe: "1"
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 180
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: cache
              mountPath: /models
              readOnly: true
              subPath: qwentts
            - name: voices
              mountPath: /voices
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: qwen3-tts-cache
        - name: voices
          persistentVolumeClaim:
            claimName: qwen3-tts-voices
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: qwen3-tts
  labels:
    app.kubernetes.io/name: qwen3-tts
    app.kubernetes.io/part-of: qwentts
spec:
  selector:
    app.kubernetes.io/name: qwen3-tts
  ports:
    - name: http
      port: 8080
      targetPort: http
