apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: qwen3-tts-voices
spec:
  parentRefs:
    - name: agenticgateway-internal
      namespace: agenticgateway
      sectionName: https
  hostnames:
    - ai.nahsi.dev
  rules:
    - matches:
        - method: GET
          path:
            type: Exact
            value: /v1/audio/voices
      backendRefs:
        - kind: Service
          name: qwen3-tts
          port: 8080
