apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: soularr
spec:
  interval: 1h
  chart:
    spec:
      chart: app-template
      version: 5.2.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    controllers:
      main:
        containers:
          main:
            image:
              repository: mrusse08/soularr
              tag: v1.2.3@sha256:e448d49d0ca6091a35653ff9198ebb4a3acf42abfc2f2056490a9a0f0cffd210
            env:
              TZ: Europe/Athens
              PUID: "65534"
              PGID: "65534"
              SCRIPT_INTERVAL: "300"

            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                memory: 512Mi

    defaultPodOptions:
      securityContext:
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch

    service:
      main:
        controller: main
        ports:
          http:
            port: 8265

    persistence:
      data:
        existingClaim: soularr-data
        globalMounts:
          - path: /data
      downloads:
        existingClaim: soularr-downloads
        globalMounts:
          - path: /downloads

    route:
      main:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: "Arr"
          gethomepage.dev/name: Soularr
          gethomepage.dev/icon: lidarr.png
          gethomepage.dev/pod-selector: "app.kubernetes.io/name=soularr"
        parentRefs:
          - name: private-gateway
            namespace: envoy-gateway
            sectionName: https
        hostnames:
          - soularr.nahsi.dev
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            timeouts:
              request: 0s
            backendRefs:
              - identifier: main
                port: http
                weight: 1
