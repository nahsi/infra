apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg-dawarich
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.7-minimal-trixie@sha256:b98ae0b74a12f20ccff32219be0e33fdd35c7e2e8e73c8bff9173f1128e167d1
  primaryUpdateStrategy: unsupervised
  postgresql:
    extensions:
      - name: postgis
        image:
          reference: ghcr.io/cloudnative-pg/postgis-extension:3.6.2-18-trixie@sha256:93584892e25a57e47e988b0f80ad9988035d1396d4a87824307eddf2242348c8
        ld_library_path:
          - system
  resources:
    requests:
      cpu: 25m
      memory: 384Mi
    limits:
      memory: 1Gi
  storage:
    size: 10Gi
    storageClass: ceph-rbd-retain
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: app
spec:
  cluster:
    name: pg-dawarich
  name: app
  owner: app
  extensions:
    - name: postgis
      ensure: present
