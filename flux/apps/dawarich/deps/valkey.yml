apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dawarich-valkey
spec:
  interval: 1h
  chart:
    spec:
      chart: valkey
      version: 1.0.0
      sourceRef:
        kind: HelmRepository
        name: valkey
        namespace: flux-system
  values:
    fullnameOverride: dawarich-valkey
    dataStorage:
      enabled: false
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 128Mi
