apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: deeptutor
spec:
  interval: 1h
  chart:
    spec:
      chart: app-template
      version: 5.2.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    controllers:
      main:
        replicas: 1
        strategy: Recreate
        containers:
          main:
            image:
              repository: ghcr.io/hkuds/deeptutor
              tag: 1.7.1@sha256:4982ca6bf43b98431366b43d1fec674a63656db3fbe49ba18c674bb6f19196dd
            env:
              TZ: Europe/Athens
            resources:
              requests:
                cpu: 250m
                memory: 512Mi
              limits:
                memory: 2Gi
            probes:
              liveness:
                enabled: true
                type: HTTP
                path: /
                port: 8001
              readiness:
                enabled: true
                type: HTTP
                path: /
                port: 8001
              startup:
                enabled: true
                type: HTTP
                path: /
                port: 8001
                spec:
                  failureThreshold: 90
                  periodSeconds: 5

    service:
      main:
        controller: main
        ports:
          http:
            port: 3782

    persistence:
      data:
        existingClaim: deeptutor-data
        globalMounts:
          - path: /app/data

    route:
      private:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Knowledge
          gethomepage.dev/name: DeepTutor
          gethomepage.dev/icon: https://raw.githubusercontent.com/HKUDS/DeepTutor/ce7c2dc2dc6b7ae3063e81be29608bdba4723a25/web/public/apple-touch-icon.png
          gethomepage.dev/pod-selector: "app.kubernetes.io/name=deeptutor"
        parentRefs:
          - name: private-gateway
            namespace: envoy-gateway
            sectionName: https
        hostnames:
          - deeptutor.nahsi.dev
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            timeouts:
              request: 300s
              backendRequest: 300s
            backendRefs:
              - identifier: main
                port: http
                weight: 1
