apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grimmory
spec:
  interval: 1h
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    controllers:
      main:
        initContainers:
          wait-db:
            image:
              repository: busybox
              tag: 1.38.0@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
            command: ['sh', '-c', 'until nc -z grimmory-mariadb.grimmory.svc.cluster.local 3306; do sleep 2; done']
        containers:
          main:
            image:
              repository: ghcr.io/grimmory-tools/grimmory
              tag: v3.5.0@sha256:bf6fe21c6e247597f7869664a440b5a34242e2d2940575cae39c17bfaa66dc0b
            resources:
              requests:
                cpu: 750m
                memory: 2Gi
              limits:
                memory: 3Gi
            env:
              TZ: Europe/Athens
              USER_ID: "1000"
              GROUP_ID: "1000"
              SWAGGER_ENABLED: "false"
              ALLOWED_ORIGINS: https://books.nahsi.dev
              DATABASE_URL: jdbc:mariadb://grimmory-mariadb.grimmory.svc.cluster.local:3306/grimmory
              DATABASE_USERNAME: grimmory
              DATABASE_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: grimmory-mariadb-user
                    key: password

    service:
      main:
        controller: main
        ports:
          http:
            port: 6060

    persistence:
      books:
        existingClaim: grimmory-books
        globalMounts:
          - path: /books
      data:
        existingClaim: grimmory-data
        globalMounts:
          - path: /app/data

    route:
      main:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: "Media"
          gethomepage.dev/name: Grimmory
          gethomepage.dev/icon: booklore.png
          gethomepage.dev/pod-selector: "app.kubernetes.io/name=grimmory"
        parentRefs:
          - name: private-gateway
            namespace: envoy-gateway
            sectionName: https
          - name: public-gateway
            namespace: envoy-gateway
            sectionName: https
        hostnames:
          - books.nahsi.dev
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - identifier: main
                port: http
                weight: 1
