---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: nfs-grimmory-library
  annotations:
    pv.kubernetes.io/provisioned-by: nfs.csi.k8s.io
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - nfsvers=4.1
    - nconnect=8
    - noatime
    - soft
    - softerr
    - timeo=50
    - retrans=3
  csi:
    driver: nfs.csi.k8s.io
    volumeHandle: nfs.lan#mnt/storage/media/library/books#grimmory
    volumeAttributes:
      server: nfs.lan
      share: /mnt/storage/media/library/books
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grimmory-library
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  volumeName: nfs-grimmory-library
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grimmory-data
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ceph-rbd-retain
  volumeName: pvc-972a9414-78ff-4001-b3fa-bc6ce95df598
  resources:
    requests:
      storage: 5Gi
