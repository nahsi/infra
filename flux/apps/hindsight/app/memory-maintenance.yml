apiVersion: batch/v1
kind: CronJob
metadata:
  name: memory-maintenance
spec:
  schedule: "0 2 * * 1-6"
  timeZone: Europe/Athens
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: maintenance
              image: ghcr.io/vectorize-io/hindsight-api:1.2.0-slim@sha256:38482a3f10dbf2ff50a5b577b2e82994cb2c9ae172183bcb46263b4550f8ec04
              command: ["python", "/scripts/memory-maintenance.py"]
              env:
                - name: HINDSIGHT_API_URL
                  value: http://hindsight-api:8888
                - name: HINDSIGHT_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: hindsight-auth
                      key: api-key
              volumeMounts:
                - name: script
                  mountPath: /scripts
                  readOnly: true
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi
          volumes:
            - name: script
              configMap:
                name: memory-maintenance
