apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hindsight
spec:
  interval: 1h
  chart:
    spec:
      chart: app-template
      version: 5.2.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    controllers:
      api:
        replicas: 1
        strategy: Recreate
        pod:
          labels:
            app.kubernetes.io/component: api
        containers:
          main:
            image:
              repository: ghcr.io/vectorize-io/hindsight-api
              tag: 1.1.0-slim@sha256:b97af4787f35f0f897cc85299e1c800e265ff98e1d70c900c58a7f9903cb5b7d

            env:
              HINDSIGHT_API_PORT: "8888"
              HINDSIGHT_API_WORKER_ID: hindsight-api
              HINDSIGHT_API_WORKER_MAX_SLOTS: "4"
              HINDSIGHT_API_WORKER_CONSOLIDATION_RESERVED_SLOTS: "1"
              HINDSIGHT_API_WORKER_RETAIN_RESERVED_SLOTS: "1"
              HINDSIGHT_API_WORKER_REFRESH_MENTAL_MODEL_RESERVED_SLOTS: "1"
              HINDSIGHT_API_MCP_ENABLED: "true"
              HINDSIGHT_API_MCP_ENABLED_TOOLS: >-
                list_banks,create_bank,get_bank,get_bank_stats,update_bank,delete_bank,clear_memories,
                list_memories,get_memory,update_memory,invalidate_memory,list_documents,get_document,delete_document,list_tags,
                list_mental_models,get_mental_model,create_mental_model,update_mental_model,delete_mental_model,refresh_mental_model,clear_mental_model,
                list_directives,create_directive,delete_directive,
                get_knowledge_base_tree,get_knowledge_page,create_knowledge_page,create_knowledge_folder,update_knowledge_node,delete_knowledge_node,
                list_operations,get_operation,cancel_operation
              HINDSIGHT_API_LLM_TRACE_ENABLED: "true"
              HINDSIGHT_API_OTEL_TRACES_ENABLED: "true"
              HINDSIGHT_API_OTEL_EXPORTER_OTLP_ENDPOINT: https://langfuse.nahsi.dev/api/public/otel
              HINDSIGHT_API_OTEL_EXPORTER_OTLP_HEADERS:
                valueFrom:
                  secretKeyRef:
                    name: hindsight-langfuse-auth
                    key: headers
              HINDSIGHT_API_OTEL_SERVICE_NAME: hindsight
              HINDSIGHT_API_OTEL_DEPLOYMENT_ENVIRONMENT: production

              HINDSIGHT_API_FILE_STORAGE_TYPE: s3
              HINDSIGHT_API_FILE_STORAGE_S3_BUCKET: hindsight
              HINDSIGHT_API_FILE_STORAGE_S3_REGION: us-east-1
              HINDSIGHT_API_FILE_STORAGE_S3_ENDPOINT: https://s3.nahsi.dev:9000
              HINDSIGHT_API_FILE_STORAGE_S3_ACCESS_KEY_ID:
                valueFrom:
                  secretKeyRef:
                    name: hindsight-s3-auth
                    key: access_key
              HINDSIGHT_API_FILE_STORAGE_S3_SECRET_ACCESS_KEY:
                valueFrom:
                  secretKeyRef:
                    name: hindsight-s3-auth
                    key: secret_key

              HINDSIGHT_API_DATABASE_URL: postgresql://app@pg-hindsight-rw:5432/app?sslmode=require
              PGPASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: pg-hindsight-app
                    key: password
              HINDSIGHT_API_DB_POOL_MIN_SIZE: "2"
              HINDSIGHT_API_DB_POOL_MAX_SIZE: "16"

              HINDSIGHT_API_TENANT_EXTENSION: hindsight_api.extensions.builtin.tenant:ApiKeyTenantExtension
              HINDSIGHT_API_TENANT_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: hindsight-auth
                    key: api-key

              HINDSIGHT_API_LLM_PROVIDER: openai
              HINDSIGHT_API_LLM_BASE_URL: https://ai.nahsi.dev/v1
              HINDSIGHT_API_LLM_MODEL: Qwen/Qwen3.8-Flash-Next
              HINDSIGHT_API_LLM_API_KEY: &inferenceApiKey
                valueFrom:
                  secretKeyRef:
                    name: hindsight-inference-auth
                    key: token
              HINDSIGHT_API_LLM_MAX_CONCURRENT: "3"
              HINDSIGHT_API_LLM_TEMPERATURE: "none"
              HINDSIGHT_API_LLM_EXTRA_BODY: '{"presence_penalty":0}'
              HINDSIGHT_API_LLM_STRICT_SCHEMA_RETAIN: "true"
              HINDSIGHT_API_LLM_STRICT_SCHEMA_CONSOLIDATION: "true"
              HINDSIGHT_API_RETAIN_LLM_REASONING_EFFORT: "none"
              HINDSIGHT_API_RETAIN_LLM_MAX_CONCURRENT: "1"
              HINDSIGHT_API_RETAIN_LLM_MAX_RETRIES: "2"
              HINDSIGHT_API_REFLECT_LLM_REASONING_EFFORT: "medium"
              HINDSIGHT_API_REFLECT_LLM_MAX_CONCURRENT: "1"
              HINDSIGHT_API_REFLECT_LLM_TIMEOUT: "90"
              HINDSIGHT_API_REFLECT_LLM_MAX_RETRIES: "1"
              HINDSIGHT_API_CONSOLIDATION_LLM_REASONING_EFFORT: "low"
              HINDSIGHT_API_CONSOLIDATION_LLM_MAX_CONCURRENT: "1"
              HINDSIGHT_API_CONSOLIDATION_LLM_MAX_RETRIES: "2"
              HINDSIGHT_API_CONSOLIDATION_LLM_TIMEOUT: "300"
              HINDSIGHT_API_MENTAL_MODEL_REFRESH_LLM_REASONING_EFFORT: "none"
              HINDSIGHT_API_MENTAL_MODEL_REFRESH_LLM_MAX_CONCURRENT: "2"
              HINDSIGHT_API_MENTAL_MODEL_REFRESH_LLM_TIMEOUT: "300"
              # Whole-job budget includes LLM slot waits and multi-call model refreshes.
              HINDSIGHT_API_REFLECT_WALL_TIMEOUT: "1200"

              HINDSIGHT_API_DECISION_MODEL_PROVIDER: typesafe
              HINDSIGHT_API_DECISION_MODEL_BASE_URL: https://openrouter.ai/api
              HINDSIGHT_API_DECISION_MODEL_MODEL: typesafe/jev-1.14
              HINDSIGHT_API_DECISION_MODEL_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: hindsight-auth
                    key: openrouter-key
              HINDSIGHT_API_RECALL_DECISION_MODEL_PROVIDER: none
              HINDSIGHT_API_REFLECT_USE_DECISION_MODEL: "false"
              HINDSIGHT_API_MENTAL_MODEL_DELTA_USE_DECISION_MODEL: "true"

              HINDSIGHT_API_EMBEDDINGS_PROVIDER: openai
              HINDSIGHT_API_EMBEDDINGS_OPENAI_BASE_URL: https://ai.nahsi.dev/v1
              HINDSIGHT_API_EMBEDDINGS_OPENAI_MODEL: Qwen/Qwen3-Embedding-0.6B
              HINDSIGHT_API_EMBEDDINGS_OPENAI_API_KEY: *inferenceApiKey
              HINDSIGHT_API_EMBEDDINGS_OPENAI_BATCH_SIZE: "1"
              # The embedding client timeout is a fixed 60s and TEI embeds ~45 tokens/s.
              HINDSIGHT_API_EMBEDDINGS_MAX_INPUT_TOKENS: "1024"
              HINDSIGHT_API_EMBEDDINGS_QUERY_PREFIX: "Instruct: Given a query, retrieve relevant passages that answer the query.\nQuery: "
              HINDSIGHT_API_EMBEDDINGS_MAX_CONCURRENT_REQUESTS: "2"

              HINDSIGHT_API_RERANKER_PROVIDER: cohere
              HINDSIGHT_API_RERANKER_COHERE_BASE_URL: https://ai.nahsi.dev/v1/rerank
              HINDSIGHT_API_RERANKER_COHERE_MODEL: zeroentropy/zerank-2
              HINDSIGHT_API_RERANKER_COHERE_API_KEY: *inferenceApiKey
              HINDSIGHT_API_RERANKER_MAX_TOKENS_PER_CANDIDATE: "2048"
              HINDSIGHT_API_RERANKER_MAX_CANDIDATES: "100"
              HINDSIGHT_API_RERANKER_MAX_CANDIDATES_LOW: "25"
              HINDSIGHT_API_RERANKER_MAX_CANDIDATES_MID: "50"
              HINDSIGHT_API_RERANKER_MAX_CANDIDATES_HIGH: "100"
              HINDSIGHT_API_RECALL_MAX_CONCURRENT: "2"
              HINDSIGHT_API_RECALL_PREFER_OBSERVATIONS: "true"

            probes:
              liveness:
                enabled: true
                type: HTTP
                path: /health/live
                port: 8888
                spec:
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                type: HTTP
                path: /health
                port: 8888
                spec:
                  initialDelaySeconds: 10
                  periodSeconds: 5
                  timeoutSeconds: 3
              startup:
                enabled: true
                type: HTTP
                path: /health/live
                port: 8888
                spec:
                  failureThreshold: 90
                  periodSeconds: 5
            resources:
              requests:
                cpu: 250m
                memory: 512Mi
              limits:
                cpu: "2"
                memory: 2Gi
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              seccompProfile:
                type: RuntimeDefault
              capabilities:
                drop:
                  - ALL

      control-plane:
        replicas: 1
        pod:
          labels:
            app.kubernetes.io/component: control-plane
        containers:
          main:
            image:
              repository: ghcr.io/vectorize-io/hindsight-control-plane
              tag: 1.1.0@sha256:373f86848649a8dadc9b2d9ecf1d18b4c446162ca7b556fc4152e92ef433e983

            env:
              NODE_ENV: production
              HINDSIGHT_CP_HOSTNAME: 0.0.0.0
              HINDSIGHT_CP_PORT: "3000"
              NEXT_TELEMETRY_DISABLED: "1"
              HINDSIGHT_CP_ACCESS_KEY:
                valueFrom:
                  secretKeyRef:
                    name: hindsight-auth
                    key: ui-access-key

              HINDSIGHT_CP_DATAPLANE_API_URL: http://hindsight-api:8888
              HINDSIGHT_CP_DATAPLANE_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: hindsight-auth
                    key: api-key

            probes:
              liveness:
                enabled: true
                type: TCP
                port: 3000
                spec:
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                type: TCP
                port: 3000
                spec:
                  initialDelaySeconds: 10
                  periodSeconds: 5
                  timeoutSeconds: 3
            resources:
              requests:
                cpu: 250m
                memory: 512Mi
              limits:
                cpu: "1"
                memory: 2Gi
            securityContext: *securityContext

    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000

    service:
      api:
        controller: api
        labels:
          app.kubernetes.io/component: api
        ports:
          http:
            port: 8888
      control-plane:
        controller: control-plane
        ports:
          http:
            port: 3000

    route:
      private:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Platform
          gethomepage.dev/name: Hindsight
          gethomepage.dev/icon: hindsight.png
          gethomepage.dev/pod-selector: "app.kubernetes.io/name=hindsight"
        parentRefs:
          - name: private-gateway
            namespace: envoy-gateway
            sectionName: https
        hostnames:
          - hindsight.nahsi.dev
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            timeouts:
              request: 360s
              backendRequest: 360s
            backendRefs:
              - identifier: control-plane
                port: http
                weight: 1
          - matches:
              - path:
                  type: PathPrefix
                  value: /v1
            timeouts:
              request: 640s
              backendRequest: 620s
            backendRefs:
              - identifier: api
                port: http
                weight: 1
