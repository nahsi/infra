---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app-mosquitto-deps
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-cert-manager
    - name: infra-cert-issuers
  path: ./flux/apps/home-automation/mosquitto/deps
  targetNamespace: home-automation
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: infra
    namespace: flux-system
  interval: 1h
  retryInterval: 2m
  timeout: 10m
  decryption:
    provider: sops
    secretRef:
      name: sops-age
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app-mosquitto
  namespace: flux-system
spec:
  dependsOn:
    - name: app-mosquitto-deps
    - name: infra-bgp
  path: ./flux/apps/home-automation/mosquitto/app
  targetNamespace: home-automation
  prune: true
  sourceRef:
    kind: GitRepository
    name: infra
    namespace: flux-system
  interval: 1h
  retryInterval: 2m
  timeout: 5m
