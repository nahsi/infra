---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app-zigbee2mqtt-deps
  namespace: flux-system
spec:
  path: ./flux/apps/home-automation/zigbee2mqtt/deps
  targetNamespace: home-automation
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: infra
    namespace: flux-system
  interval: 1h
  retryInterval: 2m
  timeout: 5m
  decryption:
    provider: sops
    secretRef:
      name: sops-age
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app-zigbee2mqtt
  namespace: flux-system
spec:
  dependsOn:
    - name: app-zigbee2mqtt-deps
    - name: app-mosquitto
    - name: infra-gateway-private
  path: ./flux/apps/home-automation/zigbee2mqtt/app
  targetNamespace: home-automation
  prune: true
  sourceRef:
    kind: GitRepository
    name: infra
    namespace: flux-system
  interval: 1h
  retryInterval: 2m
  timeout: 5m
