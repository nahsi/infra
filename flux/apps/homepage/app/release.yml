apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: homepage
spec:
  interval: 1h
  chart:
    spec:
      chart: homepage
      version: 2.1.0
      sourceRef:
        kind: HelmRepository
        name: jameswynn
        namespace: flux-system
  values:
    image:
      repository: ghcr.io/gethomepage/homepage
      tag: v2.7.0@sha256:19c5c09184458a41b7b5915e71463a39f36cd33540f41bdbed008791b8182d5f
    resources:
      requests:
        cpu: 25m
        memory: 320Mi
      limits:
        memory: 512Mi
    env:
      HOMEPAGE_ALLOWED_HOSTS: &host home.nahsi.dev
    serviceAccount:
      create: true
      name: homepage
    enableRbac: true
    config:
      bookmarks:
        - NahsiLabs:
            - Infra Repo:
                - href: https://github.com/nahsi/infra

      kubernetes:
        mode: cluster
        ingress: true
        gateway: true

      settingsString: |
        title: NahsiLabs Dashboard
        favicon: https://kubernetes.io/images/favicon.png
        theme: dark
        color: slate
        target: _self
        headerStyle: clean

        quicklaunch:
          searchDescription: true
          hideInternetSearch: true
          hideVisitURL: true

        layout:
          Productivity:
            tab: Daily Use
            style: columns
            columns: 4
          Knowledge:
            tab: Daily Use
            style: columns
            columns: 3
          Media:
            tab: Daily Use
            style: columns
            columns: 3
          Comms:
            tab: Daily Use
            style: columns
            columns: 2
          Arr:
            tab: Data Hoarding
            style: columns
            columns: 4
          Downloads:
            tab: Data Hoarding
            style: columns
            columns: 3
          Platform:
            tab: Systems
            style: columns
            columns: 4
          Observability:
            tab: Systems
            style: columns
            columns: 4
          Telephony:
            tab: Systems
            style: columns
            columns: 3

      widgets:
        - search:
            provider: [duckduckgo]
            focus: false
            target: _blank
        - kubernetes:
            cluster:
              show: true
              cpu: true
              memory: true
            nodes:
              show: false

      services:
        - Platform:
            - Proxmox:
                icon: proxmox
                href: https://proxmox.nahsi.dev
                ping: https://proxmox.nahsi.dev
            - Truenas:
                icon: truenas
                href: https://truenas.nahsi.dev
                ping: https://truenas.nahsi.dev
            - RustFS:
                icon: rustfs
                href: https://rustfs.nahsi.dev
                ping: https://rustfs.nahsi.dev
            - Unifi:
                icon: unifi
                href: https://unifi.nahsi.dev
                ping: https://unifi.nahsi.dev
            - Adguard:
                icon: adguard-home
                href: https://adguard.nahsi.dev
                ping: https://adguard.nahsi.dev
            - NPM:
                icon: nginx-proxy-manager
                href: https://npm.nahsi.dev
                ping: https://npm.nahsi.dev
            - IPMI:
                icon: asrock-rack-ipmi
                href: https://ipmi.nahsi.dev
                ping: https://ipmi.nahsi.dev
            - Wireguard:
                icon: wireguard
                href: http://vpn.nahsi.dev
                ping: http://vpn.nahsi.dev

        - Observability:
            - Scrutiny:
                icon: scrutiny
                href: https://scrutiny.nahsi.dev
                ping: https://scrutiny.nahsi.dev
            - Ceph:
                icon: ceph
                href: https://ceph.nahsi.dev
                ping: https://ceph.nahsi.dev
            - Cyberpower:
                icon: powerpanel
                href: https://power-panel.nahsi.dev
                ping: https://power-panel.nahsi.dev

        - Productivity:
            - Home Assistant:
                icon: home-assistant
                href: https://ha.nahsi.dev
                ping: https://ha.nahsi.dev

        - Telephony:
            - LiveKit:
                icon: mdi-video
                href: https://livekit.nahsi.dev
                description: Rooms, participants and telephony
            - RustPBX:
                icon: mdi-phone-voip
                href: https://rustpbx.nahsi.dev/console/
                description: PBX administration
            - Grandstream:
                icon: mdi-phone-classic
                href: http://10.2.10.9/
                description: HT801 V2 adapter administration
