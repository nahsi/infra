apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
spec:
  interval: 1h
  chart:
    spec:
      chart: immich
      version: 0.12.0
      sourceRef:
        kind: HelmRepository
        name: immich-charts
        namespace: flux-system
  postRenderers:
    - kustomize:
        patches:
          - target:
              version: v1
              kind: Deployment
              name: immich-server
            patch: |
              - op: add
                path: /spec/strategy
                value:
                  type: Recreate
          - target:
              version: v1
              kind: Deployment
              name: immich-machine-learning
            patch: |
              - op: add
                path: /spec/strategy
                value:
                  type: Recreate
  values:
    controllers:
      main:
        containers:
          main:
            image:
              repository: ghcr.io/immich-app/immich-server
              tag: "v3.4.1@sha256:7c489add298fc2f92cda4c777de6462aa206877e04087b815f62c7664af0b53b"
            env:
              TZ: Europe/Athens
              REDIS_HOSTNAME: "immich-valkey"
              IMMICH_MACHINE_LEARNING_URL: "http://immich-machine-learning:3003"
              DB_HOSTNAME:
                valueFrom:
                  secretKeyRef:
                    name: pg-immich-superuser
                    key: host
              DB_PORT:
                valueFrom:
                  secretKeyRef:
                    name: pg-immich-superuser
                    key: port
              DB_USERNAME:
                valueFrom:
                  secretKeyRef:
                    name: pg-immich-superuser
                    key: username
              DB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: pg-immich-superuser
                    key: password
              DB_DATABASE_NAME:
                valueFrom:
                  secretKeyRef:
                    name: pg-immich-app
                    key: dbname
    
    valkey:
      enabled: true
      controllers:
        main:
          containers:
            main:
              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                limits:
                  memory: 128Mi
      persistence:
        data:
          type: persistentVolumeClaim
          existingClaim: immich-valkey
    
    immich:
      metrics:
        enabled: true
      persistence:
        library:
          existingClaim: immich-photos
    
    server:
      defaultPodOptions:
        priorityClassName: high-priority
        labels:
          scheduling.nahsilabs/accelerated-workload: "true"
        affinity:
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  labelSelector:
                    matchLabels:
                      scheduling.nahsilabs/accelerated-workload: "true"
                  namespaces: [immich, jellyfin]
                  topologyKey: kubernetes.io/hostname
      serviceMonitor:
        main:
          labels:
            obs.nahsilabs/metrics: "true"
      controllers:
        main:
          containers:
            main:
              resources:
                requests:
                  cpu: 250m
                  memory: 1.5Gi
                limits:
                  cpu: "2"
                  memory: 3Gi
                  gpu.intel.com/i915: "1"
    
    machine-learning:
      defaultPodOptions:
        priorityClassName: high-priority
        labels:
          scheduling.nahsilabs/accelerated-workload: "true"
        affinity:
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  labelSelector:
                    matchLabels:
                      scheduling.nahsilabs/accelerated-workload: "true"
                  namespaces: [immich, jellyfin]
                  topologyKey: kubernetes.io/hostname
      controllers:
        main:
          containers:
            main:
              image:
                repository: ghcr.io/immich-app/immich-machine-learning
                tag: "v3.4.1-openvino@sha256:97f60b06c5938c326d3ba416bcf24bc94d233f34554c05f3b76336f98ffd5ea9"
              env:
                MACHINE_LEARNING_PRELOAD__CLIP__VISUAL: ViT-L-16-SigLIP2-512__webli
                MACHINE_LEARNING_PRELOAD__CLIP__TEXTUAL: ViT-L-16-SigLIP2-512__webli
                MACHINE_LEARNING_PRELOAD__FACIAL_RECOGNITION__RECOGNITION: buffalo_l
                MACHINE_LEARNING_PRELOAD__FACIAL_RECOGNITION__DETECTION: buffalo_l
              resources:
                requests:
                  cpu: 200m
                  memory: 8Gi
                limits:
                  cpu: "2"
                  memory: 10Gi
                  gpu.intel.com/i915: "1"
              probes:
                startup:
                  enabled: true
                  custom: true
                  spec:
                    httpGet:
                      path: /ping
                      port: 3003
                    periodSeconds: 10
                    failureThreshold: 180
      persistence:
        cache:
          type: persistentVolumeClaim
          existingClaim: immich-ml-cache
