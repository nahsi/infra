apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: lightrag
spec:
  interval: 1h
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    controllers:
      main:
        replicas: 1
        strategy: Recreate
        containers:
          main:
            image:
              repository: ghcr.io/hkuds/lightrag
              tag: v1.5.7@sha256:5bdbd524931b011df246fe20888d110cef691e6804c12cde636a2b746d7de27e
            env:
              HOST: 0.0.0.0
              PORT: "9621"
              WORKERS: "1"

              LOG_DIR: /tmp
              WORKING_DIR: /app/data/rag_storage
              INPUT_DIR: /app/data/inputs
              TIKTOKEN_CACHE_DIR: /app/data/tiktoken

              WHITELIST_PATHS: /health

              SUMMARY_LANGUAGE: Russian
              LIGHTRAG_PARSER: "md:native-etP;docx:native-etP;textpack:native-etP"
              CHUNK_P_SIZE: "2000"
              CHUNK_P_OVERLAP_SIZE: "100"
              CHUNK_P_DROP_REFERENCES: "false"
              ENTITY_EXTRACTION_USE_JSON: "true"
              VLM_PROCESS_ENABLE: "false"
              NATIVE_MD_IMAGE_DOWNLOAD_ENABLED: "false"
              ENABLE_CONTENT_HEADINGS: "true"
              ENABLE_LLM_CACHE: "false"

              LLM_BINDING: openai
              LLM_BINDING_HOST: https://ai.nahsi.dev/v1
              LLM_MODEL: Qwen/Qwen3.8-Flash-Next
              LLM_TIMEOUT: "600"
              MAX_ASYNC_LLM: "2"
              EXTRACT_MAX_ASYNC_LLM: "2"
              KEYWORD_MAX_ASYNC_LLM: "1"
              QUERY_MAX_ASYNC_LLM: "1"
              VLM_MAX_ASYNC_LLM: "1"
              MAX_ASYNC_RERANK: "2"
              MAX_PARALLEL_INSERT: "2"
              MAX_PARALLEL_ANALYZE: "2"
              EXTRACT_OPENAI_LLM_TEMPERATURE: "0"
              EXTRACT_OPENAI_LLM_EXTRA_BODY: '{"enable_thinking":false}'
              KEYWORD_OPENAI_LLM_TEMPERATURE: "0"
              KEYWORD_OPENAI_LLM_EXTRA_BODY: '{"enable_thinking":false}'
              QUERY_OPENAI_LLM_TEMPERATURE: "0.2"
              QUERY_OPENAI_LLM_TOP_P: "0.95"
              QUERY_OPENAI_LLM_PRESENCE_PENALTY: "0"
              QUERY_OPENAI_LLM_FREQUENCY_PENALTY: "0"
              QUERY_OPENAI_LLM_REASONING_EFFORT: medium
              QUERY_OPENAI_LLM_EXTRA_BODY: '{"enable_thinking":true,"top_k":20,"min_p":0}'
              VLM_OPENAI_LLM_TEMPERATURE: "0"
              VLM_OPENAI_LLM_REASONING_EFFORT: none
              VLM_OPENAI_LLM_MAX_TOKENS: "8192"
              VLM_OPENAI_LLM_EXTRA_BODY: '{"enable_thinking":false}'

              EMBEDDING_BINDING: openai
              EMBEDDING_BINDING_HOST: https://ai.nahsi.dev/v1
              EMBEDDING_MODEL: Qwen/Qwen3-Embedding-0.6B
              EMBEDDING_DIM: "1024"
              EMBEDDING_BATCH_NUM: "1"
              EMBEDDING_FUNC_MAX_ASYNC: "2"
              EMBEDDING_TOKEN_LIMIT: "4096"
              EMBEDDING_TIMEOUT: "120"
              EMBEDDING_ASYMMETRIC: "true"
              EMBEDDING_QUERY_PREFIX: "Instruct: Given a query, retrieve relevant passages that answer the query.\nQuery: "
              EMBEDDING_DOCUMENT_PREFIX: NO_PREFIX

              RERANK_BINDING: cohere
              RERANK_MODEL: zeroentropy/zerank-2
              RERANK_BINDING_HOST: https://ai.nahsi.dev/v1/rerank
              RERANK_BINDING_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: lightrag-secret
                    key: EMBEDDING_BINDING_API_KEY
              RERANK_BY_DEFAULT: "true"

              POSTGRES_HOST:
                valueFrom:
                  secretKeyRef:
                    name: pg-lightrag-app
                    key: host
              POSTGRES_PORT:
                valueFrom:
                  secretKeyRef:
                    name: pg-lightrag-app
                    key: port
              POSTGRES_USER:
                valueFrom:
                  secretKeyRef:
                    name: pg-lightrag-app
                    key: username
              POSTGRES_DATABASE:
                valueFrom:
                  secretKeyRef:
                    name: pg-lightrag-app
                    key: dbname
              POSTGRES_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: pg-lightrag-app
                    key: password

              LIGHTRAG_KV_STORAGE: PGKVStorage
              LIGHTRAG_DOC_STATUS_STORAGE: PGDocStatusStorage
              LIGHTRAG_VECTOR_STORAGE: PGVectorStorage
              LIGHTRAG_GRAPH_STORAGE: PGTableGraphStorage
            envFrom:
              - secretRef:
                  name: lightrag-secret
            probes:
              liveness:
                enabled: true
                type: HTTP
                path: /health
                port: 9621
              readiness:
                enabled: true
                type: HTTP
                path: /health
                port: 9621
              startup:
                enabled: true
                type: HTTP
                path: /health
                port: 9621
                spec:
                  failureThreshold: 90
                  periodSeconds: 5
            resources:
              requests:
                cpu: 500m
                memory: 768Mi
              limits:
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              seccompProfile:
                type: RuntimeDefault

    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000

    service:
      main:
        controller: main
        ports:
          http:
            port: 9621

    persistence:
      data:
        existingClaim: lightrag-data
        globalMounts:
          - path: /app/data
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp

    route:
      private:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Knowledge
          gethomepage.dev/name: LightRAG
          gethomepage.dev/icon: https://raw.githubusercontent.com/HKUDS/LightRAG/v1.5.7/lightrag_webui/public/favicon.png
          gethomepage.dev/pod-selector: "app.kubernetes.io/name=lightrag"
        parentRefs:
          - name: private-gateway
            namespace: envoy-gateway
            sectionName: https
        hostnames:
          - lightrag.nahsi.dev
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            timeouts:
              request: 900s
              backendRequest: 900s
            backendRefs:
              - identifier: main
                port: http
                weight: 1
