apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: livekit-valkey
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  interval: 1h
  chart:
    spec:
      chart: valkey
      version: 0.12.1
      sourceRef:
        kind: HelmRepository
        name: valkey
        namespace: flux-system
  values:
    fullnameOverride: livekit-valkey
    deploymentStrategy: Recreate
    dataStorage:
      enabled: true
      requestedSize: 1Gi
      className: ceph-rbd-retain
      keepPvc: true
    auth:
      enabled: true
      usersExistingSecret: livekit-valkey-auth
      aclUsers:
        default:
          permissions: "~* &* +@all"
    valkeyConfig: |
      appendonly yes
      appendfsync everysec
      maxmemory 256mb
      maxmemory-policy noeviction
    readinessProbe:
      enabled: true
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 512Mi
