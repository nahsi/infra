apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: memos
spec:
  interval: 1h
  chart:
    spec:
      chart: app-template
      version: 5.2.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    controllers:
      main:
        containers:
          main:
            image:
              repository: ghcr.io/usememos/memos
              tag: 26.10.0@sha256:fbc6ef8e9e0b377377f0d71d426d6192a9a0f08a8e3e35bec3557a43f4399260
            env:
              MEMOS_DRIVER: postgres
              MEMOS_DSN:
                valueFrom:
                  secretKeyRef:
                    name: pg-memos-app
                    key: uri
              MEMOS_INSTANCE_URL: "https://memos.nahsi.dev"
            resources:
              requests:
                cpu: 100m
                memory: 96Mi
              limits:
                memory: 128Mi

    persistence:
      idp:
        type: secret
        name: memos-oidc
        globalMounts:
          - path: /etc/secrets

    service:
      main:
        controller: main
        ports:
          http:
            port: 5230

    route:
      main:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: "Productivity"
          gethomepage.dev/name: Memos
          gethomepage.dev/icon: memos.png
          gethomepage.dev/pod-selector: "app.kubernetes.io/name=memos"
        parentRefs:
          - name: private-gateway
            namespace: envoy-gateway
            sectionName: https
          - name: public-gateway
            namespace: envoy-gateway
            sectionName: https
        hostnames:
          - memos.nahsi.dev
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - identifier: main
                port: http
                weight: 1
