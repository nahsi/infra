apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg-peertube
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6@sha256:899d3ed526b659d77935dde0e6bf2d69dbbf17d3d8c6486ca8cfd04bd3c18533
  primaryUpdateStrategy: unsupervised
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: preferred
    topologyKey: kubernetes.io/hostname
  storage:
    size: 10Gi
    storageClass: ceph-rbd-retain
  resources:
    requests:
      cpu: 25m
      memory: 256Mi
    limits:
      memory: 1Gi
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: app
spec:
  cluster:
    name: pg-peertube
  name: app
  owner: app
  extensions:
    - name: pg_trgm
      ensure: present
    - name: unaccent
      ensure: present
