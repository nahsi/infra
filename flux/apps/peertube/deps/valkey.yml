apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: peertube-valkey
spec:
  interval: 1h
  chart:
    spec:
      chart: valkey
      version: 0.12.0
      sourceRef:
        kind: HelmRepository
        name: valkey
        namespace: flux-system
  values:
    fullnameOverride: peertube-valkey
    deploymentStrategy: Recreate
    dataStorage:
      enabled: true
      requestedSize: 1Gi
      className: ceph-rbd-retain
    valkeyConfig: |
      appendonly yes
      appendfsync everysec
      maxmemory 256mb
      maxmemory-policy noeviction
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 384Mi
