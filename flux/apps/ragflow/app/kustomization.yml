apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - secret.yml
  - release.yml
  - admin-deny.yml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: ragflow-config
    files:
      - service_conf.yaml.template=service-conf.yml
  - name: ragflow-agentic-rag
    files:
      - agentic_rag.yaml=agentic-rag.yml
