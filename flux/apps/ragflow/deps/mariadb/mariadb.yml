apiVersion: k8s.mariadb.com/v1alpha1
kind: MariaDB
metadata:
  name: ragflow-mariadb
spec:
  rootPasswordSecretKeyRef:
    name: ragflow-mariadb-root
    key: password
    generate: true
  database: ragflow
  username: ragflow
  passwordSecretKeyRef:
    name: ragflow-mariadb-user
    key: password
  myCnf: |
    [mariadb]
    character-set-server=utf8mb4
    collation-server=utf8mb4_unicode_ci
    max_allowed_packet=256M
  storage:
    size: 5Gi
    storageClassName: ceph-rbd-retain
  image: docker-registry1.mariadb.com/library/mariadb:12.3.3@sha256:d46e102fa8b9b72bfcdeb56f9dd538742092119dc8b11f31fe662605cd234cd9
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 1Gi
  replicas: 1
