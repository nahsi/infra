apiVersion: k8s.mariadb.com/v1alpha1
kind: MariaDB
metadata:
  name: ragflow-mariadb
spec:
  rootPasswordSecretKeyRef:
    name: ragflow-mariadb-root
    key: password
    generate: true
  database: ragflow
  username: ragflow
  passwordSecretKeyRef:
    name: ragflow-mariadb-user
    key: password
  myCnf: |
    [mariadb]
    character-set-server=utf8mb4
    collation-server=utf8mb4_unicode_ci
    max_allowed_packet=256M
  storage:
    size: 5Gi
    storageClassName: ceph-rbd-retain
  image: docker-registry1.mariadb.com/library/mariadb:13.0.2@sha256:f4054da26e3a9dd6c8b5cc97363e544408b15c0fb369d7359c25dc04826eb6e1
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 1Gi
  replicas: 1
