apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ragflow-valkey
spec:
  interval: 1h
  chart:
    spec:
      chart: valkey
      version: 0.12.1
      sourceRef:
        kind: HelmRepository
        name: valkey
        namespace: flux-system
  values:
    fullnameOverride: ragflow-valkey
    deploymentStrategy: Recreate
    dataStorage:
      enabled: true
      requestedSize: 1Gi
      className: ceph-rbd-retain
    auth:
      enabled: true
      usersExistingSecret: ragflow-valkey-auth
      aclUsers:
        default:
          permissions: "~* &* +@all"
    valkeyConfig: |
      appendonly yes
      appendfsync everysec
      maxmemory 256mb
      maxmemory-policy noeviction
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi
