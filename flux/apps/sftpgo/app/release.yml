apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sftpgo
spec:
  interval: 1h
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 65
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch

    controllers:
      main:
        type: deployment
        replicas: 1
        strategy: Recreate
        containers:
          main:
            image:
              repository: ghcr.io/drakkan/sftpgo
              tag: v2.7.6
            env:
              TZ: Europe/Athens
              SFTPGO_GRACE_TIME: "60"
              SFTPGO_DATA_PROVIDER__DRIVER: sqlite
              SFTPGO_DATA_PROVIDER__NAME: /var/lib/sftpgo/sftpgo.db
              SFTPGO_DATA_PROVIDER__BACKUPS_PATH: /var/lib/sftpgo/backups
              SFTPGO_DATA_PROVIDER__CREATE_DEFAULT_ADMIN: "false"
              SFTPGO_SFTPD__BINDINGS__0__PORT: "0"
              SFTPGO_FTPD__BINDINGS__0__PORT: "0"
              SFTPGO_HTTPD__BINDINGS__0__ADDRESS: 0.0.0.0
              SFTPGO_HTTPD__BINDINGS__0__PORT: "8080"
              SFTPGO_HTTPD__BINDINGS__0__ENABLE_WEB_CLIENT: "true"
              SFTPGO_HTTPD__BINDINGS__0__ENABLE_WEB_ADMIN: "false"
              SFTPGO_HTTPD__BINDINGS__0__ENABLE_REST_API: "false"
              SFTPGO_HTTPD__BINDINGS__0__RENDER_OPENAPI: "false"
              SFTPGO_HTTPD__BINDINGS__1__ADDRESS: 127.0.0.1
              SFTPGO_HTTPD__BINDINGS__1__PORT: "8082"
              SFTPGO_HTTPD__BINDINGS__1__ENABLE_WEB_CLIENT: "false"
              SFTPGO_HTTPD__BINDINGS__1__ENABLE_WEB_ADMIN: "true"
              SFTPGO_HTTPD__BINDINGS__1__ENABLE_REST_API: "true"
              SFTPGO_HTTPD__BINDINGS__1__RENDER_OPENAPI: "false"
              SFTPGO_WEBDAVD__BINDINGS__0__ADDRESS: 0.0.0.0
              SFTPGO_WEBDAVD__BINDINGS__0__PORT: "8081"
              SFTPGO_WEBDAVD__BINDINGS__0__PREFIX: /dav
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 8080
                  periodSeconds: 30
                  timeoutSeconds: 5
              readiness: *probe
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 8080
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 30

    service:
      main:
        controller: main
        ports:
          http:
            port: 8080
          webdav:
            port: 8081

    route:
      main:
        forceRename: sftpgo
        parentRefs:
          - name: private-gateway
            namespace: envoy-gateway
            sectionName: https
          - name: public-gateway
            namespace: envoy-gateway
            sectionName: https
        hostnames:
          - sftpgo.nahsi.dev
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - identifier: main
                port: http
            timeouts:
              request: 0s
              backendRequest: 0s
      webdav:
        parentRefs:
          - name: private-gateway
            namespace: envoy-gateway
            sectionName: https
          - name: public-gateway
            namespace: envoy-gateway
            sectionName: https
        hostnames:
          - sftpgo.nahsi.dev
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /dav
            backendRefs:
              - identifier: main
                port: webdav
            timeouts:
              request: 0s
              backendRequest: 0s

    persistence:
      data:
        existingClaim: sftpgo-data
        globalMounts:
          - path: /var/lib/sftpgo
      archives:
        existingClaim: sftpgo-archives
        globalMounts:
          - path: /srv/archives
            readOnly: true
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
