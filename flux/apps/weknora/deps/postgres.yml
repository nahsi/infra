apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg-weknora
spec:
  instances: 1
  # ParadeDB ships pgvector and pg_search (BM25) in a CNPG-compatible image; WeKnora's default retriever needs both.
  imageName: docker.io/paradedb/paradedb:18-v0.25.11@sha256:a9cbdcfd8a1c349ab21590fd6d6dcbe7da489878df6502922d032dd64c1a7ae7
  postgresUID: 999
  postgresGID: 999
  primaryUpdateStrategy: unsupervised
  postgresql:
    shared_preload_libraries:
      - pg_search
  # WeKnora's migrations update pg_search; this cluster serves only WeKnora.
  managed:
    roles:
      - name: app
        ensure: present
        login: true
        superuser: true
  storage:
    size: 10Gi
    storageClass: ceph-rbd-delete
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 2Gi
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: app
spec:
  cluster:
    name: pg-weknora
  name: app
  owner: app
  extensions:
    - name: uuid-ossp
      ensure: present
    - name: vector
      ensure: present
    - name: pg_trgm
      ensure: present
    - name: pg_search
      ensure: present
