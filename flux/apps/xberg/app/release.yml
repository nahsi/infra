apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: xberg
spec:
  interval: 1h
  timeout: 15m
  chartRef:
    kind: OCIRepository
    name: xberg
    namespace: flux-system
  values:
    replicaCount: 1
    strategy:
      type: Recreate
    image:
      tag: "1.3.9@sha256:b935277537ca5f4505793cc0e1c655b23400eb9d6ffc38357581a44bb23fdac6"
    ingress:
      enabled: false
    autoscaling:
      enabled: false
    podDisruptionBudget:
      enabled: false
    resources:
      requests:
        cpu: 100m
        memory: 1Gi
      limits:
        cpu: "2"
        memory: 4Gi
    cache:
      enabled: true
      initChown: false
      size: 10Gi
      storageClass: ceph-rbd-retain
      accessModes:
        - ReadWriteOnce
    extraEnv:
      - name: XBERG_MAX_CONCURRENT_REQUESTS
        value: "2"
      - name: XBERG_CORS_ORIGINS
        value: https://xberg.nahsi.dev
