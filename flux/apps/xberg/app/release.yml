apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: xberg
spec:
  interval: 1h
  timeout: 15m
  chart:
    spec:
      chart: app-template
      version: 5.2.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    controllers:
      main:
        replicas: 1
        strategy: Recreate
        containers:
          main:
            image:
              repository: ghcr.io/xberg-io/xberg
              tag: 1.3.9@sha256:b935277537ca5f4505793cc0e1c655b23400eb9d6ffc38357581a44bb23fdac6
            args: ["serve", "--host", "0.0.0.0", "--port", "8000", "--config", "/etc/xberg/xberg.yml"]
            env:
              # Server settings are env-only; xberg.yml accepts extraction settings only.
              XBERG_MAX_CONCURRENT_REQUESTS: "2"
              XBERG_CORS_ORIGINS: https://xberg.nahsi.dev
            envFrom:
              # SOPS: XBERG_LLM_API_KEY
              - secretRef:
                  name: xberg-secret
            probes:
              startup:
                enabled: true
                type: HTTP
                path: /health
                port: 8000
                spec:
                  periodSeconds: 10
                  failureThreshold: 30
              liveness:
                enabled: true
                type: HTTP
                path: /health
                port: 8000
                spec:
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                type: HTTP
                path: /health
                port: 8000
                spec:
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 2
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                cpu: "2"
                memory: 4Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    service:
      main:
        controller: main
        ports:
          http:
            port: 8000
    persistence:
      config:
        type: configMap
        name: xberg-config
        globalMounts:
          - path: /etc/xberg
            readOnly: true
      # Models, tessdata and cached results; the image's XBERG_CACHE_DIR and HF_HOME point here.
      cache:
        existingClaim: xberg-cache
        globalMounts:
          - path: /app/.xberg
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
    route:
      main:
        parentRefs:
          - name: private-gateway
            namespace: envoy-gateway
            sectionName: https
        hostnames:
          - xberg.nahsi.dev
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            timeouts:
              request: 600s
              backendRequest: 600s
            backendRefs:
              - identifier: main
                port: http
                weight: 1
