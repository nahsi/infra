ocr:
  backend: vlm
  language: [eng]
  vlm_prompt: >-
    Transcribe this page image as Markdown, preserving its structure exactly:
    headings as headings, label/value pairs as `**Label:** value` lines, tables as
    Markdown tables with the same columns and rows, lists as lists. Copy every
    character verbatim; do not translate, summarise, correct or add anything,
    including emoji. Keep every word exactly as printed, including unusual
    spellings, word endings, grammatical forms, names and foreign-script words,
    even if they look like errors. Describe stamps, seals, signatures and logos in
    square brackets.
    Write each paragraph as a single line. When a word is split by a hyphen at the
    end of a printed line, write it whole without that hyphen; keep hyphens that
    are part of the word.
    Book and journal pages: omit the page number and the running header (the book,
    chapter or article title repeated at the top or bottom of the page). Keep
    letterheads, document numbers and dates. Put footnotes at the end of the page as
    `[^N]: text`, keeping their original numbers, and mark the reference in the text
    as `[^N]`. Footnote text continued from the previous page has no number: put it
    first among the footnotes as a plain paragraph.
  backend_options:
    vlm_figures: true
  vlm_config:
    model: openai/Qwen/Qwen3.8-Flash-Next
    base_url: https://ai.nahsi.dev/v1
    temperature: 0
    max_retries: 2
    max_concurrency: 2
    extra_body:
      chat_template_kwargs:
        enable_thinking: false
      prompt_cache_policy: no_store
include_document_structure: true
force_ocr: true
output_format: markdown
escape_markdown: false
extraction_timeout_secs: 14400
concurrency:
  max_threads: 2
pages:
  insert_page_markers: true
images:
  target_dpi: 300
  max_image_dimension: 1920
