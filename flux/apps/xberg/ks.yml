---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app-xberg
  namespace: flux-system
spec:
  dependsOn:
    - name: app-ai-gateway
    - name: infra-gateway-api-crds
  path: ./flux/apps/xberg/app
  targetNamespace: xberg
  prune: true
  sourceRef:
    kind: GitRepository
    name: infra
    namespace: flux-system
  interval: 1h
  retryInterval: 2m
  timeout: 10m
  decryption:
    provider: sops
    secretRef:
      name: sops-age
