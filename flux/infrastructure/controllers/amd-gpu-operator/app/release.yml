apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: amd-gpu-operator
spec:
  interval: 1h
  chart:
    spec:
      chart: gpu-operator-charts
      version: v1.5.1
      interval: 30m
      sourceRef:
        kind: HelmRepository
        name: amd
        namespace: flux-system
  install:
    crds: CreateReplace
    timeout: 15m
  upgrade:
    crds: CreateReplace
  values:
    crds:
      defaultCR:
        upgrade: true
    node-feature-discovery:
      enabled: false
    # Talos owns the kernel driver; do not install or watch KMM resources.
    kmm:
      enabled: false
      watch: false
    remediation:
      enabled: false
      installCRDs: false
    installdefaultNFDRule: false
    draDriver:
      deviceClass:
        create: false
    defaultDCMConfigMap:
      install: false
    deviceConfig:
      spec:
        selector:
          feature.node.kubernetes.io/amd-gpu: "true"
        driver:
          enable: false
          blacklist: false
        devicePlugin:
          enableDevicePlugin: true
          devicePluginImage: docker.io/rocm/k8s-device-plugin:1.31.0.12
          devicePluginTolerations:
            - key: scheduling.nahsilabs/dedicated
              operator: Equal
              value: halogen
              effect: NoSchedule
          enableNodeLabeller: true
          nodeLabellerImage: docker.io/rocm/k8s-device-plugin:labeller-1.31.0.9
          nodeLabellerTolerations:
            - key: scheduling.nahsilabs/dedicated
              operator: Equal
              value: halogen
              effect: NoSchedule
        metricsExporter:
          enable: true
          image: docker.io/rocm/device-metrics-exporter:v1.5.3
          resource:
            requests:
              cpu: 50m
              memory: 512M
            limits:
              cpu: "2"
              memory: 4G
          tolerations:
            - key: scheduling.nahsilabs/dedicated
              operator: Equal
              value: halogen
              effect: NoSchedule
          prometheus:
            serviceMonitor:
              enable: true
              interval: 30s
              labels:
                obs.nahsilabs/metrics: "true"
              relabelings:
                - action: replace
                  sourceLabels:
                    - __meta_kubernetes_pod_node_name
                  targetLabel: instance
                  regex: (.*)
                  replacement: $1.talos
        testRunner:
          enable: false
        configManager:
          enable: false
        draDriver:
          enable: false
        remediationWorkflow:
          enable: false
