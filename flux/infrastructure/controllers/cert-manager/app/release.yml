apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
spec:
  interval: 1h
  chart:
    spec:
      chart: cert-manager
      version: "v1.21.3"
      sourceRef:
        kind: HelmRepository
        name: cert-manager
        namespace: flux-system
      interval: 12h
  values:
    installCRDs: true
    prometheus:
      enabled: true
      servicemonitor:
        enabled: true
        labels:
          scrape: "true"
    resources:
      requests:
        cpu: 25m
        memory: 128Mi
      limits:
        memory: 256Mi
    cainjector:
      resources:
        requests:
          cpu: 25m
          memory: 192Mi
        limits:
          memory: 256Mi
    webhook:
      resources:
        requests:
          cpu: 25m
          memory: 80Mi
        limits:
          memory: 128Mi
