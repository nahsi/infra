apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configurations:
  - kustomizeconfig.yml
resources:
  - release.yml
configMapGenerator:
  - name: crowdsec-config
    files:
      - config.yaml.local=configs/config.yml
      - envoy-json.yaml=configs/envoy-json.yml
      - nahsilabs-whitelist.yaml=configs/whitelist.yml
