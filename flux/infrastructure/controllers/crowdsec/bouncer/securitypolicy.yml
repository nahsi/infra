apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: crowdsec
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: public-gateway
  extAuth:
    # a bouncer outage must not take every public app down
    failOpen: true
    grpc:
      backendRefs:
        - name: crowdsec-envoy-bouncer
          port: 8080
