---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-crowdsec-deps
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-cloudnative-pg
  interval: 1h
  retryInterval: 2m
  timeout: 10m
  prune: true
  wait: true
  targetNamespace: crowdsec
  sourceRef:
    kind: GitRepository
    name: infra
    namespace: flux-system
  path: ./flux/infrastructure/controllers/crowdsec/deps
  decryption:
    provider: sops
    secretRef:
      name: sops-age
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-crowdsec
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-crowdsec-deps
  interval: 1h
  retryInterval: 2m
  timeout: 15m
  prune: true
  wait: true
  targetNamespace: crowdsec
  sourceRef:
    kind: GitRepository
    name: infra
    namespace: flux-system
  path: ./flux/infrastructure/controllers/crowdsec/app
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-crowdsec-bouncer
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-crowdsec
    - name: infra-gateway-public
  interval: 1h
  retryInterval: 2m
  timeout: 10m
  prune: true
  targetNamespace: envoy-gateway
  sourceRef:
    kind: GitRepository
    name: infra
    namespace: flux-system
  path: ./flux/infrastructure/controllers/crowdsec/bouncer
  decryption:
    provider: sops
    secretRef:
      name: sops-age
