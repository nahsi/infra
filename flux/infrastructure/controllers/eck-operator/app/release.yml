apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: eck-operator
spec:
  chart:
    spec:
      chart: eck-operator
      version: 3.5.0
      sourceRef:
        kind: HelmRepository
        name: elastic
        namespace: flux-system
  interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    installCRDs: true
    resources:
      requests:
        cpu: 50m
        memory: 150Mi
      limits:
        memory: 512Mi
    telemetry:
      disabled: true
    config:
      metrics:
        port: "8080"
