apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: eck-operator
  labels:
    obs.nahsilabs/metrics: "true"
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: elastic-operator
      app.kubernetes.io/instance: eck-operator
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      scheme: http
      interval: 30s
