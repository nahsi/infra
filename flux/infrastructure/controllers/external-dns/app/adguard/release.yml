apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns-adguard
spec:
  interval: 1h
  chart:
    spec:
      chart: external-dns
      version: 1.23.0
      sourceRef:
        kind: HelmRepository
        name: external-dns
        namespace: flux-system
  values:
    domainFilters: ["nahsi.dev"]
    sources:
      - gateway-httproute
      - crd
      - service
    provider:
      name: webhook
      webhook:
        image:
          repository: ghcr.io/muhlba91/external-dns-provider-adguard
          tag: v11.2.0@sha256:a119f729b16d435769aefcd9d4be149d4be7142848439bafd45e4045aa0b2e4e
          pullPolicy: IfNotPresent
        env:
          - name: ADGUARD_URL
            value: https://adguard.nahsi.dev
          - name: &name ADGUARD_USER
            valueFrom:
              secretKeyRef:
                name: &secret external-dns-adguard-secret
                key: *name
          - name: &name ADGUARD_PASSWORD
            valueFrom:
              secretKeyRef:
                name: *secret
                key: *name
          - name: SERVER_HOST
            value: 0.0.0.0
        securityContext:
          readOnlyRootFilesystem: true
        resources:
          requests:
            cpu: 10m
            memory: 48Mi
          limits:
            memory: 64Mi
    interval: 1h
    triggerLoopOnEvent: true
    policy: sync
    registry: noop
    extraArgs:
      - --webhook-provider-url=http://localhost:8888
      - --target-net-filter=192.168.78.0/24
    serviceMonitor:
      enabled: true
      additionalLabels:
        scrape: "true"
    resources:
      requests:
        cpu: 10m
        memory: 160Mi
      limits:
        memory: 256Mi
