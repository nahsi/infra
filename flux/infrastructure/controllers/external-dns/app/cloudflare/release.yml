apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns-cloudflare
spec:
  interval: 1h
  chart:
    spec:
      chart: external-dns
      version: 1.23.0
      sourceRef:
        kind: HelmRepository
        name: external-dns
        namespace: flux-system
      interval: 5m
  values:
    env:
      - name: CF_API_TOKEN
        valueFrom:
          secretKeyRef:
            name: external-dns-cloudflare
            key: CF_API_TOKEN
    sources:
      - gateway-httproute
      - service
    policy: sync
    txtOwnerId: nahsilabs
    domainFilters:
      - "nahsi.dev"
    provider: cloudflare
    extraArgs:
      - --target-net-filter=37.98.199.176/29
      - --service-type-filter=LoadBalancer
      - --label-filter=cilium-bgp-private!=true
    serviceMonitor:
      enabled: true
      additionalLabels:
        scrape: "true"
    resources:
      requests:
        cpu: 10m
        memory: 160Mi
      limits:
        memory: 256Mi
