apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
spec:
  interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  chart:
    spec:
      chart: external-secrets
      version: 2.14.0
      sourceRef:
        kind: HelmRepository
        name: external-secrets
        namespace: flux-system
  values:
    crds:
      create: true
    resources:
      requests:
        cpu: 10m
        memory: 192Mi
      limits:
        memory: 512Mi
    certController:
      resources:
        requests:
          cpu: 10m
          memory: 192Mi
        limits:
          memory: 512Mi
    webhook:
      resources:
        requests:
          cpu: 10m
          memory: 160Mi
        limits:
          memory: 256Mi
