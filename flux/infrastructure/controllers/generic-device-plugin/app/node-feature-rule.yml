apiVersion: nfd.k8s-sigs.io/v1alpha1
kind: NodeFeatureRule
metadata:
  name: amd-npu
spec:
  rules:
    - name: amd-npu
      labels:
        feature.node.kubernetes.io/amd-npu: "true"
      matchFeatures:
        - feature: pci.device
          matchExpressions:
            vendor:
              op: In
              value: ["1022"]
            device:
              op: In
              value: ["1502", "17f0", "17f2", "17f3", "1b0b", "1b0c"]
