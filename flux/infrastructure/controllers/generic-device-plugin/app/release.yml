apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: generic-device-plugin
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: generic-device-plugin
    namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: DaemonSet
              name: generic-device-plugin
            patch: |
              apiVersion: apps/v1
              kind: DaemonSet
              metadata:
                name: generic-device-plugin
              spec:
                template:
                  spec:
                    nodeSelector:
                      feature.node.kubernetes.io/amd-npu: "true"
  values:
    image:
      repository: docker.io/squat/generic-device-plugin
      tag: 0.2.0@sha256:66c8d5c270eb2b721f1064c549b9b7898152a6d2f0163380a5d37dc7636c20ff
      pullPolicy: IfNotPresent
    deployPodMonitor: false
    devices:
      - name: amd-npu
        groups:
          - paths:
              - path: /dev/accel/accel0
