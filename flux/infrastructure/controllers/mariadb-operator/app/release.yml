apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mariadb-operator
spec:
  chart:
    spec:
      chart: mariadb-operator
      version: 26.10.2
      sourceRef:
        kind: HelmRepository
        name: mariadb-operator
        namespace: flux-system
  interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    image:
      repository: docker-registry3.mariadb.com/mariadb-operator/mariadb-operator
    crds:
      enabled: true
    resources:
      requests:
        cpu: 50m
        memory: 320Mi
      limits:
        memory: 512Mi
    webhook:
      resources:
        requests:
          cpu: 10m
          memory: 80Mi
        limits:
          memory: 128Mi
    certController:
      resources:
        requests:
          cpu: 10m
          memory: 192Mi
        limits:
          memory: 512Mi
