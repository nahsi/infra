apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: node-feature-discovery
spec:
  interval: 1h
  chart:
    spec:
      chart: node-feature-discovery
      version: 0.20.1
      sourceRef:
        kind: HelmRepository
        name: kubernetes-sigs-nfd
        namespace: flux-system
      interval: 30m
  install:
    crds: CreateReplace
    timeout: 15m
  upgrade:
    crds: CreateReplace
  values:
    featureGates: null
    master:
      startupProbe:
        failureThreshold: 60
        timeoutSeconds: 5
      livenessProbe:
        timeoutSeconds: 5
      resources:
        requests:
          cpu: 21m
          memory: 128Mi
        limits:
          memory: 128Mi
    worker:
      tolerations:
        - key: scheduling.nahsilabs/dedicated
          operator: Equal
          value: halogen
          effect: NoSchedule
      config:
        core:
          sources:
            - cpu
            - pci
            - system
            - usb
      resources:
        requests:
          cpu: 5m
          memory: 48Mi
        limits:
          memory: 64Mi
